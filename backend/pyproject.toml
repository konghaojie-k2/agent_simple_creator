[project]
name = "agent-builder"
version = "0.1.0"
description = "Simple Agent Builder with Multi-Provider Support"
readme = "README.md"
authors = [
    { name = "konghaojie-k2", email = "konghaojie@k2data.com.cn" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.5.0",
    "pyyaml>=6.0.0",
    "prompt-toolkit>=3.0.0",
    "cryptography>=41.0.0",
    "sqlite-vec>=0.1.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_builder"]
